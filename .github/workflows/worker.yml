name: Desplegar alertas

on:
  push:
    branches: [main]
    paths: ["worker/**", "config.yaml", ".github/workflows/worker.yml"]
  workflow_dispatch: {}

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      API_URL: https://api.buscavuelosbaratos.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Comprobar secrets
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN RESEND_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret $v (Settings → Secrets and variables → Actions)"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pyyaml
      - run: npm install --no-audit --no-fund

      - name: Pruebas
        run: npm test

      - name: Base de datos (D1)
        run: |
          find_id() {
            npx wrangler d1 list --json | python3 -c "import sys,json; print(next((d.get('uuid') or d.get('id') for d in json.load(sys.stdin) if d.get('name')=='bvb-alertas'),''))"
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create bvb-alertas
            ID=$(find_id)
          fi
          echo "D1: $ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx wrangler d1 execute bvb-alertas --remote --file=schema.sql --yes

      - name: Publicar servidor
        run: npx wrangler deploy

      - name: Claves del servidor
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY

      - name: Conectar el bot de Telegram
        run: |
          SECRET=$(python3 -c "import hashlib,os; print(hashlib.sha256(('bvb-webhook:'+os.environ['TELEGRAM_BOT_TOKEN']).encode()).hexdigest()[:48])")
          curl -sS -f "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${API_URL}/telegram" \
            --data-urlencode "secret_token=${SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]'
          echo
          curl -sS -f "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setMyCommands" \
            -H "Content-Type: application/json" \
            -d '{"commands":[{"command":"alerta","description":"Crear una alerta de ruta"},{"command":"misalertas","description":"Ver y quitar tus alertas"},{"command":"cancelar","description":"Cancelar"},{"command":"ayuda","description":"Cómo funciona"}],"language_code":""}'
          echo

      - name: Comprobar que responde
        run: |
          curl -sS -f --retry 10 --retry-delay 15 --retry-all-errors "${API_URL}/"
          echo
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print('webhook:', r.get('url'), '| pendientes:', r.get('pending_update_count'), '| último error:', r.get('last_error_message','ninguno'))"

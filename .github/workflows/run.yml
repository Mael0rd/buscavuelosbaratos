name: Buscar ofertas y publicar

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch: {}       # botón "Run workflow" manual
  push:
    branches: [main]          # publicar al subir cambios de código
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bvb
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # siempre la versión más reciente, también en re-runs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Pipeline
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m bvb.main

      - name: Guardar historial de precios
        run: |
          git config user.name "bvb-bot"
          git config user.email "bvb-bot@users.noreply.github.com"
          git add data/bvb.sqlite
          git commit -m "Actualizar precios $(date -u +'%Y-%m-%d %H:%M')" || echo "sin cambios"
          # Por si main avanzó durante la corrida (otro commit), ponerse al día antes de subir
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

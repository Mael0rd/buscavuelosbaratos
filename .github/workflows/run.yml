name: Buscar ofertas y publicar

on:
  schedule:
    - cron: "47 */6 * * *"   # respaldo: el reloj principal (cada hora) está en Cloudflare
  workflow_dispatch: {}       # botón "Run workflow" manual
  push:
    branches: [main]          # publicar al subir cambios de código
    paths-ignore: ["**.md", "worker/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bvb
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # El historial de precios vive en la rama "data" (un solo commit que se
      # reemplaza cada vez), para que el repositorio no crezca sin control.
      - name: Recuperar historial
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:historial.sqlite > data/historial.sqlite && echo "Historial recuperado"
          else
            echo "Sin historial previo (primera corrida)"
          fi

      - name: Pipeline
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BVB_VARS: ${{ toJSON(vars) }}   # canales por país: TELEGRAM_CHANNEL_<PAÍS>
        run: python -m bvb.main

      - name: Guardar historial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/hist && mkdir /tmp/hist
          cp data/historial.sqlite /tmp/hist/
          cd /tmp/hist
          git init -q -b data
          git add historial.sqlite
          git -c user.name="bvb-bot" -c user.email="bvb-bot@users.noreply.github.com" \
              commit -qm "Historial $(date -u +'%Y-%m-%d %H:%M')"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

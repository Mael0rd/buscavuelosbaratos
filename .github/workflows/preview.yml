name: Vista previa (ramas)

# Al subir a cualquier rama que no sea main: arma la web con el historial actual
# (rama "data", solo lectura) y la publica como vista previa de Cloudflare Pages en
# https://<rama>.buscavuelosbaratos.pages.dev
# No busca precios, no verifica (no gasta SerpApi/Apify), no envía alertas ni publica en
# redes y no guarda el historial. Producción (main) no cambia.
on:
  push:
    branches-ignore: [main, data]
    paths-ignore: ["**.md", "worker/**", "blog/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Recuperar historial (solo lectura)
        run: |
          mkdir -p data
          git fetch --depth=1 origin data && git show FETCH_HEAD:historial.sqlite > data/historial.sqlite

      - name: Armar la web
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # solo para leer el nombre del bot
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          BVB_VARS: ${{ toJSON(vars) }}
          BVB_EXTRAS_CHECKS: "2000"   # sin caché entre corridas: comprobar y convertir todo de una vez
          BVB_EXTRAS_LINKS: "2000"
        run: python -m bvb.main --build-only

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Publicar vista previa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site --project-name=buscavuelosbaratos \
            --branch="${{ github.ref_name }}" --commit-dirty=true
          echo "Vista previa: https://$(echo '${{ github.ref_name }}' | tr '/_' '--' | tr '[:upper:]' '[:lower:]').buscavuelosbaratos.pages.dev"

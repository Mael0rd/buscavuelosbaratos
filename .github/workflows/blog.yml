name: Desplegar blog

on:
  push:
    branches: [main]
    paths: ["blog/**", ".github/workflows/blog.yml"]
  workflow_dispatch: {}

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blog
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Comprobar secrets
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret $v (Settings → Secrets and variables → Actions)"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund

      - name: Publicar blog
        run: npx wrangler deploy

      - name: Comprobar que responde
        run: curl -sS -f --retry 10 --retry-delay 15 --retry-all-errors -o /dev/null -w "%{http_code}\n" https://buscavuelosbaratos.com/blog

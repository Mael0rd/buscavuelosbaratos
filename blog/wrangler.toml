# Blog de guías de viaje en buscavuelosbaratos.com/blog. Lo despliega el workflow "Desplegar blog".
# Es estático: las guías están en src/historias.js y se cambian a mano.
name = "bvb-blog"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
# Solo /blog* llega a este Worker; el resto del dominio sigue saliendo de GitHub Pages.
routes = [{ pattern = "buscavuelosbaratos.com/blog*", zone_name = "buscavuelosbaratos.com" }]

# Vacío a propósito: borra en Cloudflare el cron de la versión anterior, que escribía guías con IA.
[triggers]
crons = []

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.title }} — {{ site.tagline }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.tagline }}{% endblock %}">
  <link rel="stylesheet" href="/static/style.css">
  <!-- Travelpayouts Drive -->
  <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1" data-cmp-ab="2">
    (function () {
        var script = document.createElement("script");
        script.async = 1;
        script.setAttribute("data-cmp-ab","2");
        script.src = 'https://emrldtp.cc/NTk4ODQ2.js?t=598846';
        document.head.appendChild(script);
    })();
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">✈ {{ site.title }}</a>
    <span class="tag">{{ site.tagline }}</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <p>Precios en USD encontrados recientemente; pueden cambiar en cualquier momento.
       Algunos enlaces son de afiliado: si compras, recibimos una comisión sin costo extra para ti.</p>
    <p class="muted">Actualizado: {{ updated }}</p>
  </footer>
</body>
</html>

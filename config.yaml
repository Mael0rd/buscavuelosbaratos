# Configuración de buscavuelosbaratos.com
site:
  domain: buscavuelosbaratos.com
  title: "Busca Vuelos Baratos"
  tagline: "Ofertas de vuelos desde Hispanoamérica, detectadas automáticamente"
  currency: usd

# Países de salida (sección de la web) y sus ciudades de salida (códigos IATA de ciudad).
# Solo se publican viajes internacionales: las rutas dentro del mismo país se descartan.
# El orden aquí es el orden en que aparecen en la web.
countries:
  mexico:          { name: "México",               flag: "🇲🇽", origins: [MEX, CUN, GDL, MTY, TIJ] }
  guatemala:       { name: "Guatemala",            flag: "🇬🇹", origins: [GUA] }
  el-salvador:     { name: "El Salvador",          flag: "🇸🇻", origins: [SAL] }
  honduras:        { name: "Honduras",             flag: "🇭🇳", origins: [SAP, TGU] }
  nicaragua:       { name: "Nicaragua",            flag: "🇳🇮", origins: [MGA] }
  costa-rica:      { name: "Costa Rica",           flag: "🇨🇷", origins: [SJO, LIR] }
  panama:          { name: "Panamá",               flag: "🇵🇦", origins: [PTY] }
  cuba:            { name: "Cuba",                 flag: "🇨🇺", origins: [HAV] }
  dominicana:      { name: "República Dominicana", flag: "🇩🇴", origins: [SDQ, PUJ, STI] }
  puerto-rico:     { name: "Puerto Rico",          flag: "🇵🇷", origins: [SJU] }
  colombia:        { name: "Colombia",             flag: "🇨🇴", origins: [BOG, MDE, CLO, CTG] }
  venezuela:       { name: "Venezuela",            flag: "🇻🇪", origins: [CCS] }
  ecuador:         { name: "Ecuador",              flag: "🇪🇨", origins: [UIO, GYE] }
  peru:            { name: "Perú",                 flag: "🇵🇪", origins: [LIM] }
  bolivia:         { name: "Bolivia",              flag: "🇧🇴", origins: [VVI, LPB] }
  chile:           { name: "Chile",                flag: "🇨🇱", origins: [SCL] }
  argentina:       { name: "Argentina",            flag: "🇦🇷", origins: [BUE, COR] }
  uruguay:         { name: "Uruguay",              flag: "🇺🇾", origins: [MVD] }
  paraguay:        { name: "Paraguay",             flag: "🇵🇾", origins: [ASU] }

search:
  months_ahead: 9        # meses hacia adelante a revisar
  round_trip: true
  limit_per_query: 1000  # destinos por consulta (un boleto, el más barato, por destino)
  max_transfers: 2       # descartar boletos con más escalas
  pause_seconds: 0.5     # pausa entre consultas para respetar límites de la API

deals:
  # Con historial: oferta = al menos drop_pct por debajo de la mediana de la ruta
  drop_pct: 0.30
  min_days: 7            # días de historial necesarios para usar la mediana
  history_days: 60
  # Sin historial (primeros días), deben cumplirse las dos:
  #  1) bajo el tope por distancia: k * (km ida y vuelta) ^ exp  → SJO-MIA ≈ $175, SJO-MAD ≈ $480
  #  2) month_drop por debajo de la mediana de los otros meses de la misma ruta
  #     (si la ruta tiene precio en menos de min_months meses, se exige en cambio
  #      quedar bajo tope × few_months_factor)
  cold_start: { k: 0.85, exp: 0.65, month_drop: 0.25, min_months: 3, few_months_factor: 0.75 }
  repost_days: 7         # no repetir una ruta antes de esto...
  repost_extra_drop: 0.10  # ...salvo que baje otro 10%
  show_days: 14          # días que una oferta sigue visible en la web

social:
  max_per_run: 5         # máximo de posts en Telegram por corrida (las mejores)

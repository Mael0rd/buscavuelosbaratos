# Configuración de buscavuelosbaratos.com
site:
  domain: buscavuelosbaratos.com
  title: "Busca Vuelos Baratos"
  tagline: "Ofertas de vuelos desde Latinoamérica, detectadas automáticamente"
  currency: usd
  contact_email: contacto@buscavuelosbaratos.com

# Países de salida (sección de la web) y sus ciudades de salida (códigos IATA de ciudad).
# Solo se publican viajes internacionales: las rutas dentro del mismo país se descartan.
# El orden aquí es el orden en que aparecen en la web.
countries:
  mexico:          { name: "México",               cc: MX, flag: "🇲🇽", origins: [MEX, CUN, GDL, MTY, TIJ] }
  guatemala:       { name: "Guatemala",            cc: GT, flag: "🇬🇹", origins: [GUA] }
  el-salvador:     { name: "El Salvador",          cc: SV, flag: "🇸🇻", origins: [SAL] }
  honduras:        { name: "Honduras",             cc: HN, flag: "🇭🇳", origins: [SAP, TGU] }
  nicaragua:       { name: "Nicaragua",            cc: NI, flag: "🇳🇮", origins: [MGA] }
  costa-rica:      { name: "Costa Rica",           cc: CR, flag: "🇨🇷", origins: [SJO, LIR] }
  panama:          { name: "Panamá",               cc: PA, flag: "🇵🇦", origins: [PTY] }
  cuba:            { name: "Cuba",                 cc: CU, flag: "🇨🇺", origins: [HAV] }
  dominicana:      { name: "República Dominicana", cc: DO, flag: "🇩🇴", origins: [SDQ, PUJ, STI] }
  puerto-rico:     { name: "Puerto Rico",          cc: PR, flag: "🇵🇷", origins: [SJU] }
  colombia:        { name: "Colombia",             cc: CO, flag: "🇨🇴", origins: [BOG, MDE, CLO, CTG] }
  venezuela:       { name: "Venezuela",            cc: VE, flag: "🇻🇪", origins: [CCS] }
  ecuador:         { name: "Ecuador",              cc: EC, flag: "🇪🇨", origins: [UIO, GYE] }
  peru:            { name: "Perú",                 cc: PE, flag: "🇵🇪", origins: [LIM] }
  bolivia:         { name: "Bolivia",              cc: BO, flag: "🇧🇴", origins: [VVI, LPB] }
  chile:           { name: "Chile",                cc: CL, flag: "🇨🇱", origins: [SCL] }
  argentina:       { name: "Argentina",            cc: AR, flag: "🇦🇷", origins: [BUE, COR] }
  uruguay:         { name: "Uruguay",              cc: UY, flag: "🇺🇾", origins: [MVD] }
  paraguay:        { name: "Paraguay",             cc: PY, flag: "🇵🇾", origins: [ASU] }

# Zonas horarias de cada país (para poner primero las ofertas del país del visitante).
# Una zona que termina en '/' cubre todas las que empiezan así.
timezones:
  mexico: [America/Mexico_City, America/Cancun, America/Merida, America/Monterrey, America/Matamoros, America/Chihuahua, America/Ciudad_Juarez, America/Ojinaga, America/Mazatlan, America/Bahia_Banderas, America/Hermosillo, America/Tijuana]
  guatemala: [America/Guatemala]
  el-salvador: [America/El_Salvador]
  honduras: [America/Tegucigalpa]
  nicaragua: [America/Managua]
  costa-rica: [America/Costa_Rica]
  panama: [America/Panama]
  cuba: [America/Havana]
  dominicana: [America/Santo_Domingo]
  puerto-rico: [America/Puerto_Rico]
  colombia: [America/Bogota]
  venezuela: [America/Caracas]
  ecuador: [America/Guayaquil, Pacific/Galapagos]
  peru: [America/Lima]
  bolivia: [America/La_Paz]
  chile: [America/Santiago, America/Punta_Arenas, Pacific/Easter]
  argentina: [America/Argentina/, America/Buenos_Aires, America/Cordoba, America/Mendoza, America/Catamarca, America/Jujuy]
  uruguay: [America/Montevideo]
  paraguay: [America/Asuncion]

search:
  months_ahead: 9        # meses hacia adelante a revisar
  round_trip: true
  limit_per_query: 1000  # destinos por consulta (un boleto, el más barato, por destino)
  max_transfers: 1       # solo vuelos directos o con 1 escala (ida y vuelta)
  min_trip_days: 3       # mínimo de días entre la ida y la vuelta
  pause_seconds: 0.5     # pausa entre consultas para respetar límites de la API

deals:
  # Con historial: oferta = al menos drop_pct por debajo de la mediana de la ruta
  drop_pct: 0.10
  min_days: 7            # días de historial necesarios para usar la mediana
  history_days: 60
  # Sin historial (primeros días), deben cumplirse las dos:
  #  1) bajo el tope por distancia: k * (km ida y vuelta) ^ exp  → SJO-MIA ≈ $262, SJO-MAD ≈ $717
  #     (es solo la primera criba: el juez final es la verificación en vivo de Google)
  #  2) month_drop por debajo de la mediana de los otros meses de la misma ruta (0.10 = 10%)
  #     (si la ruta tiene precio en menos de min_months meses, se exige en cambio
  #      quedar bajo tope × few_months_factor; 1.0 = mismo tope)
  cold_start: { k: 1.275, exp: 0.65, month_drop: 0.10, min_months: 3, few_months_factor: 1.0 }
  repost_days: 7         # no repetir una ruta antes de esto...
  repost_extra_drop: 0.10  # ...salvo que baje otro 10%
  show_days: 14          # días que una oferta sigue visible en la web

seo:
  route_min_days: 3      # días de historial para que una ruta tenga página propia (/vuelos/...)
  index_min_days: 14     # ...y para que Google la indexe (antes: noindex, follow; fuera del sitemap)
  index_min_months: 2    # ...además de precios en al menos 2 meses de salida
  redirect_days: 90      # ofertas terminadas: redirigir su URL a la página de la ruta durante 90 días

social:
  # Canal general (TELEGRAM_CHANNEL) y canales por país (variable TELEGRAM_CHANNEL_<PAÍS>,
  # p. ej. TELEGRAM_CHANNEL_MEXICO). Se publican primero las mejores ofertas.
  main:    { per_run: 1, per_day: 10 }
  country: { per_run: 2, per_day: 10 }
  quiet_hours: [23, 6]           # no publicar de 11 p. m. a 6 a. m. (hora local del canal)
  timezone: America/Costa_Rica   # hora del canal general
  # Canales regionales: un solo canal para varios países con pocas ofertas
  # (variable TELEGRAM_CHANNEL_<REGIÓN>). Si un país tiene su propio canal, ese tiene prioridad.
  regions:
    centroamerica:
      name: Centroamérica
      aliases: [ca]              # también vale TELEGRAM_CHANNEL_CA
      countries: [costa-rica, panama, guatemala, el-salvador, honduras, nicaragua]
      # Canal de WhatsApp (semiautomático: el bot le manda cada oferta lista al administrador,
      # variable WHATSAPP_RELAY_CHAT = su ID de chat de Telegram, y él la pega en el canal)
      whatsapp: { url: "https://whatsapp.com/channel/0029Vb8nUFML2AU7LFDB4441", per_run: 1, per_day: 3 }

verify:
  # Verificación en vivo (Google Flights) antes de publicar en Telegram.
  # Cada oferta se verifica UNA vez y se reparte a su canal de país + el general.
  serpapi_monthly: 250         # plan gratis de SerpApi (secret SERPAPI_KEY)
  apify_monthly: 1000          # ~$5 gratis al mes de Apify (secret APIFY_TOKEN)
  apify_actor: kuezi~flight-offers-api
  cache_hours: 3               # una verificación sirve para todos los canales durante 3 h
  # Google como referencia: si marca el precio en vivo como "bajo" para esa ruta y
  # fechas, se publica (con el precio de Google). Si da "típico"/"alto", no se publica.
  # Si no da nivel (rutas poco buscadas), el precio en vivo puede subir hasta price_tolerance.
  price_tolerance: 0.15
  require_low_level: true      # con nivel "típico"/"alto" no se publica
  # Orden para verificar: descuento ajustado por antigüedad del precio.
  # prioridad = score × (1 + horas_desde_que_se_vio / freshness_weight_hours); menor = primero.
  # Con 48: una oferta vista hace 48 h "pesa" el doble que una recién vista.
  freshness_weight_hours: 48
  # Web: solo se muestran ofertas verificadas en vivo. Se re-verifican cada
  # web_reverify_hours (antes que las nuevas) y se ocultan si no se reconfirman
  # en web_max_age_hours.
  web_reverify_hours: 12
  web_max_age_hours: 24

freshness:
  max_age_hours: 168     # candidatas con precio en caché de hasta 7 días (Google verifica en vivo antes de mostrar)
  stale_hours: 192       # sin verificación en vivo, termina si no se reconfirma en este tiempo (debe ser > max_age_hours)
  price_tolerance: 0.10  # se considera el mismo precio si no subió más de 10%
  min_days_before_departure: 2   # termina la oferta si la salida está a menos de 2 días
  pause_seconds: 0.25

alerts:
  api_base: https://api.buscavuelosbaratos.com   # servidor de alertas (Cloudflare Worker)
  repeat_days: 7          # no repetir el aviso de una alerta antes de esto...
  repeat_extra_drop: 0.10 # ...salvo que el precio baje otro 10%
  max_emails_per_run: 80  # tope de correos por corrida
  mail_from: "Busca Vuelos Baratos <alertas@buscavuelosbaratos.com>"


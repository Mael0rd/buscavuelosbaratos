# Configuración de buscavuelosbaratos.com
site:
  domain: buscavuelosbaratos.com
  title: "Busca Vuelos Baratos"
  tagline: "Ofertas de vuelos desde Costa Rica, detectadas automáticamente"
  currency: usd

# Aeropuertos de salida (IATA)
origins: [SJO, LIR]

# Destinos a vigilar. max_price = precio "de oferta" mientras no hay historial suficiente.
destinations:
  MIA: { name: "Miami", max_price: 250 }
  NYC: { name: "Nueva York", max_price: 350 }
  MCO: { name: "Orlando", max_price: 280 }
  LAX: { name: "Los Ángeles", max_price: 400 }
  MEX: { name: "Ciudad de México", max_price: 300 }
  CUN: { name: "Cancún", max_price: 300 }
  BOG: { name: "Bogotá", max_price: 280 }
  MDE: { name: "Medellín", max_price: 280 }
  LIM: { name: "Lima", max_price: 400 }
  PTY: { name: "Panamá", max_price: 200 }
  MAD: { name: "Madrid", max_price: 650 }
  BCN: { name: "Barcelona", max_price: 700 }

search:
  months_ahead: 6        # cuántos meses hacia adelante consultar
  round_trip: true
  limit_per_query: 10

deals:
  drop_pct: 0.25         # oferta = 25% o más bajo que la mediana histórica
  min_samples: 8         # observaciones mínimas para confiar en la mediana
  history_days: 45
  repost_days: 7         # no repetir la misma ruta/mes antes de esto...
  repost_extra_drop: 0.10  # ...salvo que baje otro 10%
  show_days: 14          # cuánto tiempo sigue visible una oferta en la web
